[project]
name = "websearch"
description = "Web search and deep research via Parallel, anonymous or keyed; optional Claude synthesis"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.54.0",
    "httpx>=0.28.0",
    "parallel-web>=0.6.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
websearch = "centaur_tool_websearch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_websearch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
# WEBSEARCH_BACKEND (sandbox env, default `parallel`) picks the vendor. Within a
# vendor, `search` tries the keyed REST path with the injected placeholder and
# falls back to that vendor's anonymous path on 401 or 403. `deep-research`
# needs the vendor's key: PARALLEL_API_KEY for the Parallel Task API.
# ANTHROPIC_API_KEY enables the Claude synthesis pipeline on top of `search`
# results (reviewer → writer → citation repair).
# Give every secret below its own `hosts`. An entry that omits them inherits the
# top-level `hosts` list, which would bind it to search.parallel.ai — the path
# that must stay anonymous.
optional_secrets = [
    {type = "http", name = "PARALLEL_API_KEY", mode = "inject", inject_header = "x-api-key", hosts = ["api.parallel.ai"]},
    {type = "http", name = "ANTHROPIC_API_KEY", mode = "inject", inject_header = "x-api-key", hosts = ["api.anthropic.com"]},
]
hosts = ["api.parallel.ai", "search.parallel.ai", "api.anthropic.com"]
